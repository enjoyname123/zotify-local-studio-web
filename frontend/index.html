<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zotify Local Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: {
        colors: { studio: { bg: '#131314', card: '#1e1f20', line: '#303134', blue: '#8ab4f8', text: '#e3e3e3', muted: '#8e918f', green: '#81c995', red: '#f28b82' } },
        fontFamily: { mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace'] }
      }}
    };
  </script>
  <style>
    body { background: #131314; color: #e3e3e3; }
    input, select { color-scheme: dark; }
    input:focus, select:focus { outline: 2px solid #8ab4f8; outline-offset: 1px; }
    .switch input:checked + span { background: #8ab4f8; }
    .switch input:checked + span:after { transform: translateX(20px); background: #131314; }
    .switch span { background: #454746; }
    .switch span:after { content: ''; position: absolute; width: 16px; height: 16px; left: 3px; top: 3px; border-radius: 50%; background: #c4c7c5; transition: transform .2s; }
  </style>
</head>
<body class="min-h-screen font-sans">
  <header class="fixed inset-x-0 top-0 z-20 h-16 border-b border-studio-line bg-studio-bg/95 backdrop-blur">
    <div class="mx-auto flex h-full max-w-7xl items-center justify-between px-5">
      <div class="flex items-center gap-3"><div class="grid h-9 w-9 place-items-center rounded-xl bg-studio-blue text-lg font-bold text-studio-bg">Z</div><div><h1 class="font-medium tracking-tight">Zotify Local Studio</h1><p class="text-xs text-studio-muted">Private downloader workspace</p></div></div>
      <div class="flex items-center gap-3 text-xs"><span id="connection" class="flex items-center gap-2 text-studio-muted"><i class="h-2 w-2 rounded-full bg-studio-muted"></i>Connecting</span><button id="save" class="rounded-full bg-studio-blue px-4 py-2 font-medium text-studio-bg hover:brightness-110">Save settings</button></div>
    </div>
  </header>
  <main class="mx-auto max-w-7xl space-y-5 px-5 pb-56 pt-24">
    <section class="rounded-2xl border border-studio-line bg-studio-card p-5 shadow-2xl">
      <div class="mb-4 flex items-center justify-between"><div><h2 class="text-lg font-medium">Add to download queue</h2><p class="mt-1 text-sm text-studio-muted">Paste a Spotify track, album, playlist, or artist URL.</p></div><span id="queue-count" class="rounded-full bg-studio-bg px-3 py-1 text-xs text-studio-muted">0 queued</span></div>
      <div class="flex flex-col gap-3 sm:flex-row"><input id="target" class="min-w-0 flex-1 rounded-xl border border-studio-line bg-studio-bg px-4 py-3 text-sm placeholder:text-studio-muted" placeholder="https://open.spotify.com/playlist/..." autocomplete="off"><button id="enqueue" class="rounded-xl bg-studio-blue px-6 py-3 font-medium text-studio-bg hover:brightness-110">Queue download</button></div>
    </section>
    <div class="grid gap-5 lg:grid-cols-2">
      <section class="rounded-2xl border border-studio-line bg-studio-card p-5"><h2 class="mb-5 text-lg font-medium">Core settings</h2><div class="grid gap-4 sm:grid-cols-2">
        <label class="text-sm text-studio-muted">Format<select data-config="download_format" class="mt-2 w-full rounded-xl border border-studio-line bg-studio-bg px-3 py-2.5"><option>ogg</option><option>mp3</option><option>flac</option><option>aac</option><option>m4a</option><option>opus</option><option>vorbis</option></select></label>
        <label class="text-sm text-studio-muted">Quality<select data-config="download_quality" class="mt-2 w-full rounded-xl border border-studio-line bg-studio-bg px-3 py-2.5"><option>auto</option><option>normal</option><option>high</option><option>very_high</option></select></label>
        <label class="text-sm text-studio-muted sm:col-span-2">Output template<input data-config="output" class="mt-2 w-full rounded-xl border border-studio-line bg-studio-bg px-3 py-2.5 font-mono text-xs"></label>
        <label class="text-sm text-studio-muted sm:col-span-2">Root music path<input data-config="root_path" class="mt-2 w-full rounded-xl border border-studio-line bg-studio-bg px-3 py-2.5 font-mono text-xs"></label>
      </div></section>
      <section class="rounded-2xl border border-studio-line bg-studio-card p-5"><h2 class="mb-5 text-lg font-medium">Metadata & credentials</h2><div class="space-y-4">
        <label class="text-sm text-studio-muted">Credentials location<input data-config="credentials_location" class="mt-2 w-full rounded-xl border border-studio-line bg-studio-bg px-3 py-2.5 font-mono text-xs"></label>
        <label class="flex cursor-pointer items-center justify-between rounded-xl border border-studio-line bg-studio-bg p-3 text-sm">Upload credentials.json<input id="credentials" type="file" accept=".json" class="w-44 text-xs text-studio-muted"></label>
        <div class="grid gap-3 sm:grid-cols-2"><label class="text-sm text-studio-muted">Transcode bitrate<input data-config="transcode_bitrate" type="number" min="1" placeholder="Optional" class="mt-2 w-full rounded-xl border border-studio-line bg-studio-bg px-3 py-2.5"></label><label class="text-sm text-studio-muted">Chunk size<input data-config="chunk_size" type="number" class="mt-2 w-full rounded-xl border border-studio-line bg-studio-bg px-3 py-2.5"></label></div>
      </div></section>
    </div>
    <section class="rounded-2xl border border-studio-line bg-studio-card p-5"><h2 class="mb-5 text-lg font-medium">Safety & rate limits</h2><div class="grid gap-3 md:grid-cols-2 lg:grid-cols-3">
      <div data-switch="download_real_time"></div><div data-switch="download_lyrics"></div><div data-switch="skip_existing"></div><div data-switch="skip_previously_downloaded"></div><div data-switch="split_album_discs"></div><div data-switch="md_allgenres"></div><div data-switch="override_auto_wait"></div>
      <label class="text-sm text-studio-muted">Retry attempts<input data-config="retry_attempts" type="number" min="0" class="mt-2 w-full rounded-xl border border-studio-line bg-studio-bg px-3 py-2.5"></label><label class="text-sm text-studio-muted">Bulk wait time (seconds)<input data-config="bulk_wait_time" type="number" min="0" class="mt-2 w-full rounded-xl border border-studio-line bg-studio-bg px-3 py-2.5"></label>
    </div></section>
    <section class="rounded-2xl border border-studio-line bg-studio-card p-5"><div class="mb-4 flex items-center justify-between"><h2 class="text-lg font-medium">Download queue</h2><button id="clear" class="text-xs text-studio-muted hover:text-studio-text">Clear completed</button></div><div id="queue" class="space-y-2 text-sm text-studio-muted"><p>Queue is empty.</p></div></section>
  </main>
  <aside id="terminal" class="fixed inset-x-0 bottom-0 z-10 h-44 border-t border-studio-line bg-[#0d0e0f] transition-all"><button id="terminal-toggle" class="absolute -top-9 right-5 rounded-t-lg border border-b-0 border-studio-line bg-[#0d0e0f] px-4 py-2 text-xs text-studio-muted">Hide terminal</button><div class="mx-auto h-full max-w-7xl overflow-auto p-4 font-mono text-xs leading-5" id="logs"><div class="text-studio-muted">Terminal ready.</div></div></aside>
  <script>
    const labels = { download_real_time: 'Download real-time (anti-ban)', download_lyrics: 'Download synced lyrics', skip_existing: 'Skip existing files', skip_previously_downloaded: 'Skip previously downloaded', split_album_discs: 'Split album discs', md_allgenres: 'Save all genres', override_auto_wait: 'Override auto wait (danger)' };
    const configEls = [...document.querySelectorAll('[data-config]')]; const switches = {};
    for (const el of document.querySelectorAll('[data-switch]')) { const key = el.dataset.switch; el.innerHTML = `<label class="flex items-center justify-between rounded-xl border border-studio-line bg-studio-bg p-3 text-sm">${labels[key]}<span class="switch relative inline-block h-[22px] w-[42px]"><input data-config="${key}" type="checkbox" class="peer sr-only"><span class="absolute inset-0 rounded-full transition-colors"></span></span></label>`; switches[key] = el.querySelector('input'); }
    function allConfig() { const result = {}; document.querySelectorAll('[data-config]').forEach(el => result[el.dataset.config] = el.type === 'checkbox' ? el.checked : (el.value === '' ? null : (el.type === 'number' ? Number(el.value) : el.value))); return result; }
    function setConfig(config) { document.querySelectorAll('[data-config]').forEach(el => { const value = config[el.dataset.config]; if (el.type === 'checkbox') el.checked = Boolean(value); else el.value = value ?? ''; }); }
    async function loadConfig() { const response = await fetch('/api/config'); if (!response.ok) throw new Error('Could not load settings'); setConfig(await response.json()); }
    async function saveConfig() { const response = await fetch('/api/config', { method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify(allConfig()) }); if (!response.ok) throw new Error(await response.text()); addLog('system', 'Settings saved.\\n'); }
    function addLog(stream, text) { const line = document.createElement('div'); line.className = stream === 'stderr' ? 'text-studio-red' : stream === 'system' ? 'text-studio-blue' : 'text-studio-text'; line.textContent = text; document.getElementById('logs').append(line); const logs = document.getElementById('logs'); logs.scrollTop = logs.scrollHeight; }
    function renderQueue(items) { const root = document.getElementById('queue'); root.innerHTML = items.length ? items.map(item => `<div class="flex items-center justify-between gap-3 rounded-xl border border-studio-line bg-studio-bg p-3"><span class="min-w-0 truncate font-mono text-xs">${item.url}</span><span class="${item.status === 'completed' ? 'text-studio-green' : item.status === 'failed' ? 'text-studio-red' : item.status === 'running' ? 'text-studio-blue' : 'text-studio-muted'} text-xs capitalize">${item.status}</span></div>`).join('') : '<p>Queue is empty.</p>'; document.getElementById('queue-count').textContent = `${items.filter(i => i.status === 'queued' || i.status === 'running').length} active`; }
    async function enqueue() { const input = document.getElementById('target'); if (!input.value.trim()) return input.focus(); const response = await fetch('/api/queue', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({url: input.value.trim(), config: allConfig()})}); if (!response.ok) return addLog('stderr', await response.text()); input.value = ''; addLog('system', 'Added to queue.\\n'); }
    document.getElementById('enqueue').onclick = enqueue; document.getElementById('save').onclick = () => saveConfig().catch(error => addLog('stderr', error.message + '\\n')); document.getElementById('target').onkeydown = event => { if (event.key === 'Enter') enqueue(); };
    document.getElementById('clear').onclick = async () => { const response = await fetch('/api/queue/completed', {method:'DELETE'}); if (!response.ok) addLog('stderr', await response.text()); };
    document.getElementById('credentials').onchange = async event => { if (!event.target.files[0]) return; const form = new FormData(); form.append('file', event.target.files[0], 'credentials.json'); const response = await fetch('/api/credentials', {method:'POST', body:form}); addLog(response.ok ? 'system' : 'stderr', response.ok ? 'Credentials uploaded.\\n' : await response.text()); };
    document.getElementById('terminal-toggle').onclick = event => { const terminal = document.getElementById('terminal'); terminal.classList.toggle('h-11'); event.target.textContent = terminal.classList.contains('h-11') ? 'Show terminal' : 'Hide terminal'; };
    const socketProtocol = location.protocol === 'https:' ? 'wss' : 'ws'; let reconnectTimer; function connectSocket() { const socket = new WebSocket(`${socketProtocol}://${location.host}/ws`); socket.onopen = () => { clearTimeout(reconnectTimer); document.getElementById('connection').innerHTML = '<i class="h-2 w-2 rounded-full bg-studio-green"></i>Connected'; }; socket.onclose = () => { document.getElementById('connection').innerHTML = '<i class="h-2 w-2 rounded-full bg-studio-red"></i>Reconnecting'; reconnectTimer = setTimeout(connectSocket, 2000); }; socket.onerror = () => socket.close(); socket.onmessage = event => { const data = JSON.parse(event.data); if (data.type === 'log') addLog(data.stream, data.text); if (data.type === 'queue') renderQueue(data.items); }; } connectSocket();
    loadConfig().catch(error => addLog('stderr', error.message + '\\n')); fetch('/api/queue').then(response => response.json()).then(data => renderQueue(data.items));
  </script>
</body>
</html>
